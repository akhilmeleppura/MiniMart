<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="mm-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="mm-shadow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon Base -->
  <g filter="url(#mm-shadow-dark)">
    <rect x="8" y="10" width="44" height="44" rx="12" fill="url(#mm-grad-dark)" />
    <!-- Handle -->
    <path d="M22 18 C22 13, 38 13, 38 18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- M Shopping Cart Motif -->
    <path d="M20 28 L25 40 L30 31 L35 40 L40 28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="24" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Text -->
  <text x="64" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#F8FAFC">Mini</tspan><tspan fill="#60A5FA">Mart</tspan>
  </text>
  <circle cx="218" cy="22" r="4" fill="#14B8A6"/>
</svg>
